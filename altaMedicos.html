<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Médicos - IDW S.A</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css" type="text/css">
</head>

<body>
    <header class="bg-primary text-white py-3 mb-4">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <a class="navbar-brand" href="#">IDW S.A</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse mt-2 mt-lg-0" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a href="index.html" class="nav-link">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a href="contacto.html" class="nav-link">Contacto</a>
                        </li>
                        <li class="nav-item">
                            <a href="institucional.html" class="nav-link">Institucional</a>
                        </li>
                        <li class="nav-item">
                            <a href="login.html" class="nav-link">Login</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>
    <main class="container">
        <section class="mb-5">
            <h2 class="mb-3">Alta de Médicos</h2>
            <form id="altaMedicoForm" class="border rounded p-4 bg-light shadow-sm">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre y Apellido</label>
                    <input type="text" class="form-control" id="nombre" required>
                <div class="mb-3">
                    <label for="especialidad" class="form-label">Especialidad</label>
                    <input type="text" class="form-control" id="especialidad" required>
                </div>
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" required>
                </div>
                 <div class="mb-3">
                    <label for="obraSocial" class="form-label">Obras Sociales (separadas por coma)</label>
                    <input type="text" class="form-control" id="obraSocial" placeholder="OSDE, IOMA, Swiss Medical" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn btn-primary">Registrar Médico</button>
            </form>
        </section>
        <!--Lista de medicos-->
        <section>
            <h3 class="mb-3">Listado de Médicos</h3>
            <div class="table-responsive">
                <table class="table table-bordered align-middle" id="tablaMedicos">
                    <thead class="table-primary">
                        <tr>
                            <th>Nombre y Apellido</th>
                            <th>Especialidad</th>
                            <th>Teléfono</th>
                            <th>Obras Sociales</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Los médicos se agregarán aquí dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0">© 2025 IDW S.A</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/altaMedicos.js"></script>
</body>
</html>
